       x="-370.72388"
       y="0"><tspan
         x="1592.1875"
         y="358.23072"
         id="tspan23846">Ἀχιλλεὺς Τάτιος, Αἰλιανός, Αἰνείας ὁ Τακτικός, Αἰσχίνης, Αἰσχύλος, </tspan><tspan
         x="1592.1875"
         y="398.42698"
         id="tspan23848">Ἀγαθήμερος, Ἀνδοκίδης, Ἀνώνυμος, Ἀντιφῶν, Ἀπολλόδωρος, </tspan><tspan
         x="1592.1875"
         y="438.62324"
         id="tspan23850">Ἀπολλώνιος Ῥόδιος, Ἀππιανός, Ἄρατος ὁ Σολεύς, Ἀρεταῖος, Αἴλιος </tspan><tspan
         x="1592.1875"
         y="478.8195"
         id="tspan23852">Ἀριστείδης, Ἀριστοφάνης, Ἀριστοτέλης, Ἀρριανός, Ἀσκληπιόδοτος, </tspan><tspan
         x="1592.1875"
         y="519.01576"
         id="tspan23854">Ἀθήναιος, Βακχυλίδης, Βαρνάβας, Βασίλειος, Βίων ὁ Σμυρναῖος, </tspan><tspan
         x="1592.1875"
         y="559.21199"
         id="tspan23856">Καλλίμαχος, Καλλίστρατος, Κάσσιος Δίων, Χαρίτων, Κλαύδιος </tspan><tspan
         x="1592.1875"
         y="599.40821"
         id="tspan23858">Πτολεμαῖος, Κλήμης ὁ Ἀλεξανδρεύς, Κόλλουθος, Δημάδης, </tspan><tspan
         x="1592.1875"
         y="639.60444"
         id="tspan23860">Δημήτριος Φαληρεύς, Δημοσθένης, Δείναρχος, Δίων Χρυσόστομος, </tspan><tspan
         x="1592.1875"
         y="679.80067"
         id="tspan23862">Διόδωρος Σικελιώτης, Διογένης Λαέρτιος, Διονύσιος Ἁλικαρνασσεύς, </tspan><tspan
         x="1592.1875"
         y="719.9969"
         id="tspan23864">Ἐπίκτητος, Εὐκλείδης, Εὐριπίδης, Εὐσέβιος, Φλάβιος Ἰώσηπος, </tspan><tspan
         x="1592.1875"
         y="760.19313"
         id="tspan23866">Γαληνός, Οὐαλέριος Ἁρποκρατίων, Ἡρόδοτος, Ἡσίοδος, Ἱπποκράτης, </tspan><tspan
         x="1592.1875"
         y="800.38935"
         id="tspan23868">Ὅμηρος, Ὑπερείδης, Ἰσαῖος, Ἰσοκράτης, Ἰωάννης ὁ Δαμασκηνός, </tspan><tspan
         x="1592.1875"
         y="840.58558"
         id="tspan23870">Ἰουλιανός, Λογγῖνος, Λόγγος, Λουκιανός, Λυκόφρων, Λυκοῦργος, </tspan><tspan
         x="1592.1875"
         y="880.78181"
         id="tspan23872">Λυσίας, Μάρκος Αὐρήλιος, Μόσχος, Νόννος ὁ Πανοπολίτης, </tspan><tspan
         x="1592.1875"
         y="920.97804"
         id="tspan23874">Ὀνήσανδρος, Ὀππιανός, Ὀππιανὸς Ἀπαμεύς, Παρθένιος, Παυσανίας, </tspan><tspan
         x="1592.1875"
         y="961.17427"
         id="tspan23876">Φιλόστρατος ὁ νεώτερος, Φιλόστρατος ὁ Ἀθηναῖος, Φιλόστρατος ὁ </tspan><tspan
         x="1592.1875"
